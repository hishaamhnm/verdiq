<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdiq Dashboard</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #07120d;
      color: white;
    }

    .dashboard {
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      height: 100vh;
      background: #0d1e17;
      padding: 20px;
      position: fixed;
    }

    .sidebar h2 {
      color: #8cffb0;
      margin-bottom: 20px;
    }

    .sidebar p {
      margin: 8px 0;
      color: #cfe7d8;
    }

    .sidebar button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #8cffb0;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    /* MAIN */
    .content {
      margin-left: 260px;
      padding: 30px;
      width: 100%;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .card h3 {
      color: #8cffb0;
    }

    .big-number {
      font-size: 32px;
      margin-top: 10px;
    }

    .actions {
      margin-top: 30px;
    }

    .btn {
      padding: 12px 18px;
      background: #8cffb0;
      border: none;
      cursor: pointer;
      margin-right: 10px;
      font-weight: bold;
      border-radius: 8px;
    }

    .danger {
      background: #ff5c5c;
      color: white;
    }

    .user-email {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Verdiq 🌱</h2>

    <p class="user-email" id="user-email">Loading...</p>

    <hr style="opacity:0.2; margin:15px 0;">

    <p>💳 Wallet</p>
    <p id="credits">Credits: 0</p>

    <p>🌍 CO₂ Saved</p>
    <p id="co2">0 kg</p>

    <button onclick="logout()">Logout</button>

  </div>

  <!-- MAIN CONTENT -->
  <div class="content">

    <div class="topbar">
      <h1>Dashboard</h1>
    </div>

    <!-- CARDS -->
    <div class="grid">

      <div class="card">
        <h3>Total Credits</h3>
        <div class="big-number" id="main-credits">0 CC</div>
      </div>

      <div class="card">
        <h3>CO₂ Impact</h3>
        <div class="big-number" id="main-co2">0 kg</div>
      </div>

      <div class="card">
        <h3>Wallet Value</h3>
        <div class="big-number" id="wallet-value">0 QAR</div>
        <p style="opacity:0.7;">100 CC = 1 QAR</p>
      </div>

      <div class="card">
        <h3>Activity</h3>
        <p>Recycle, travel green, save energy → earn credits</p>
      </div>

    </div>

    <!-- ACTIONS -->
    <div class="actions">

      <h2>Test Actions</h2>

      <div class="actions">

  <h2>Earn Carbon Credits</h2>

  <button class="btn" onclick="addCredits(10)">
    🚆 Public Transport (+10)
  </button>

  <button class="btn" onclick="addCredits(20)">
    ♻ Recycling (+20)
  </button>

  <button class="btn" onclick="addCredits(15)">
    🚶 Walking / Cycling (+15)
  </button>

  <button class="btn" onclick="addCredits(25)">
    ⚡ Saved Electricity (+25)
  </button>

  <button class="btn" onclick="addCredits(30)">
    🌱 Eco Purchase (+30)
  </button>

  <button class="btn danger" onclick="addCredits(-10)">
    ❌ Carbon Penalty (-10)
  </button>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="js/app.js"></script>

</body>
</html>
